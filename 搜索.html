<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全站搜索 · 伊尔莱德照明技术方案</title>
<style>
  @font-face{font-family:'Instrument Sans';src:url('_shared/fonts/InstrumentSans-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
  @font-face{font-family:'Instrument Sans';src:url('_shared/fonts/InstrumentSans-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
</style>
<style>
:root{--bg:#EEF1F0;--surface:#fff;--text:#16211E;--muted:#5F6E6A;--brand:#0F8A66;--brand-deep:#075A42;--border:#D8E1DE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Instrument Sans','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;line-height:1.7;font-size:1rem}
.wrap{max-width:1080px;margin:0 auto;padding:40px 24px 100px}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.topbar a{color:var(--brand);text-decoration:none;font-weight:600}
.backlink{display:inline-flex;align-items:center;gap:6px}
.hero{background:linear-gradient(135deg,#075A42,#0F8A66);border-radius:16px;padding:32px 32px;color:#fff}
.hero h1{margin:0;font-size:1.6rem}
.hero p{margin:8px 0 0;opacity:.9;font-size:.95rem}
.box{margin-top:22px;position:relative}
.search-row{display:flex;gap:0;box-shadow:0 8px 24px rgba(7,90,66,.18);border-radius:14px;overflow:hidden}
.search-row input{flex:1;border:none;outline:none;padding:16px 20px;font-size:1.05rem;font-family:inherit;color:var(--text)}
.search-row button{border:none;background:var(--brand-deep);color:#fff;padding:0 26px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.search-row button:hover{background:#064d35}
.hint{margin:10px 4px 0;color:#dce9e2;font-size:.82rem;opacity:.85}
.status{margin:22px 4px 0;font-size:.92rem;color:var(--muted)}
.sec-title{margin:30px 0 6px;font-size:1.02rem;font-weight:700;color:var(--brand-deep);display:flex;align-items:center;gap:10px}
.sec-count{font-size:.76rem;color:var(--muted);font-weight:600;background:var(--border);border-radius:999px;padding:1px 9px}
.res{margin-top:8px}
.dcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:12px;transition:.15s}
.dcard:hover{border-color:var(--brand);box-shadow:0 6px 16px rgba(22,33,30,.07)}
a.dcard{display:block;text-decoration:none;color:inherit}
.dcard .dtitle{font-size:1rem;font-weight:700;color:var(--brand-deep);margin-bottom:4px}
.dcard .dsub{font-size:.9rem;color:var(--text);margin-bottom:4px}
.dcard .dmeta{font-size:.78rem;color:var(--muted)}
.dcard .dhead{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.tag{font-size:.68rem;font-weight:700;border-radius:6px;padding:1px 8px;color:#fff}
.tag-book{background:#7C3AED}.tag-src{background:#1F6FB2}
mark{background:#FDE68A;color:#92400E;border-radius:3px;padding:0 1px}
.big-note{background:#FDF3F3;border:1px solid #F3D0D0;color:#A33;border-radius:10px;padding:12px 16px;margin:16px 0;font-size:.88rem}
.none{background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:30px;text-align:center;color:var(--muted)}
@media(max-width:720px){.search-row{flex-direction:column}.search-row button{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="backlink" href="0-技术方案总索引.html">← 返回方案总索引</a>
  </div>
  <div class="hero">
    <h1>全站搜索</h1>
    <p>同时检索 8 本技术手册（全文）与原始资料归档（文件），输入关键词实时查找。</p>
    <div class="box">
      <div class="search-row">
        <input id="q" type="text" placeholder="输入关键词，如：DALI / 自组网 / 睿壹 / 三防灯 / 皓II / Modbus …" autocomplete="off">
        <button id="btn" type="button">搜索</button>
      </div>
      <div class="hint">示例：换算模块 · 组网 · 排查 · 验收 · 昆仑电源 · 投光灯 · 电梯间方案</div>
    </div>
  </div>
  <div id="status" class="status"></div>
  <div id="reswrap" style="display:none">
    <div class="sec-title">资料手册（全文匹配）<span id="docCount" class="sec-count">0</span></div>
    <div class="res" id="docs"></div>
    <div class="sec-title">原始资料（文件匹配）<span id="srcCount" class="sec-count">0</span></div>
    <div class="res" id="srcs"></div>
    <div id="bigNote"></div>
    <div id="none" class="none" style="display:none">未找到匹配结果，请尝试其他关键词（支持品牌、系列、协议、章节名等）。</div>
  </div>
</div>

<script src="_shared/search-data.js"></script>
<script>
(function(){
  var input=document.getElementById('q'),btn=document.getElementById('btn'),
      statusEl=document.getElementById('status'),
      reswrap=document.getElementById('reswrap'),
      docsEl=document.getElementById('docs'),srcsEl=document.getElementById('srcs'),
      docCount=document.getElementById('docCount'),srcCount=document.getElementById('srcCount'),
      bigNote=document.getElementById('bigNote'),noneEl=document.getElementById('none');
  var docs=window.SEARCH_DOCS||[],srcs=window.SEARCH_SRCS||[],bigSet=new Set(window.SEARCH_BIG||[]),place=window.SEARCH_PLACEHOLDERS||{};

  function esc(s){return (s+'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function mark(s,kh){if(!kh)return esc(s);var i=s.toLowerCase().indexOf(kh);if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+kh.length))+'</mark>'+esc(s.slice(i+kh.length));}

  function run(){
    var kw=input.value.trim();
    docsEl.innerHTML='';srcsEl.innerHTML='';bigNote.innerHTML='';
    if(!kw){statusEl.textContent='请输入关键词';return;}
    var khl=kw.toLowerCase();
    statusEl.textContent='正在搜索「'+kw+'」…';
    reswrap.style.display='block';noneEl.style.display='none';
    var docP=[],srcP=[],bigP=[];
    docs.forEach(function(d){docP.push(fetchDoc(d,khl,kw));});
    srcs.forEach(function(s){
      var hay=(s.file+' '+s.name).toLowerCase();
      if(hay.indexOf(khl)>=0){
        var card=document.createElement('a');
        card.className='dcard';
        var isBig=bigSet.has(s.file);
        var href = isBig ? (place[s.file]||'#') : esc(s.file);
        if(isBig){ card.href=esc(place[s.file]||'#'); }
        else { card.href=esc(s.file); }
        var meta = s.big ? '<span class="dmeta" style="color:#A33">（超大文件未上云 · 点击查看说明占位页）</span>' : (s.size>0?('<span class="dmeta">'+s.size+' MB</span>'):'<span class="dmeta">源文件</span>');
        card.innerHTML='<div class="dhead"><span class="tag tag-src">原始资料</span><span class="tag" style="background:#0D9488">'+mark(s.file.split('/')[1],khl)+'</span></div>'+
          '<div class="dtitle">'+mark(s.name,khl)+'</div>'+
          '<div class="dmeta" style="margin-top:4px">'+esc(s.file)+'</div>'+meta;
        if(isBig){ srcP.push(card); bigP.push(card); }
        else srcP.push(card);
      }
    });
    Promise.all(docP).then(function(){
      var dcount=0,scount=0;
      reswrap.querySelectorAll('#docs .dcard').forEach(function(){dcount++;});
      reswrap.querySelectorAll('#srcs .dcard').forEach(function(){scount++;});
      if(!dcount&&!scount)noneEl.style.display='block';
      docCount.textContent=dcount;srcCount.textContent=scount;
      if(bigP.length){bigNote.innerHTML='<b>提示：</b>以下超大文件已超出 GitHub 100MB 上传上限，未上云，搜索结果中仅保留索引（点击无跳转，请下载本地原始资料查看）：<br>'+bigP.map(function(c){var n=c.querySelector('.dtitle').textContent;return '· '+esc(n);}).join('<br>');}
    });
  }
  function fetchDoc(d,khl,kw){
    return fetch(d.file).then(function(r){return r.ok?r.text():'';}).then(function(html){
      var re=/<h([1-3])[^>]*id="([^"]+)"[^>]*>([\s\S]*?)<\/h\1>/gi,m,anchors=[];
      while((m=re.exec(html))){var t=m[3].replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').trim();if(t)anchors.push({id:m[2],lvl:+m[1],title:t});}
      var txt=html.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'');
      var idx=txt.toLowerCase().indexOf(khl);
      if(idx<0)return;
      var doc=document.createElement('a');
      doc.className='dcard';doc.href=esc(d.file);
      doc.innerHTML='<div class="dhead"><span class="tag tag-book">手册</span><span class="dtitle" style="margin:0">'+mark(d.name,khl)+'</span></div>'+
        '<div class="dsub" style="margin-top:6px">'+snippet(txt,idx,kw,khl)+'</div>'+
        '<div class="dmeta">'+esc(d.file)+' · 命中关键词</div>';
      docsEl.appendChild(doc);
    }).catch(function(){});
  }
  function snippet(txt,idx,kw,khl){
    var start=Math.max(0,idx-40);var s=txt.slice(start,idx+80).replace(/\s+/g,' ');
    var i=s.toLowerCase().indexOf(khl);
    if(i<0)return esc(s.slice(0,80));
    return mark(s.slice(0,i)+'···'+s.slice(i),khl);
  }
  btn.addEventListener('click',run);
  input.addEventListener('keydown',function(e){if(e.key==='Enter')run();});
  // URL 带 ?q= 参数时自动搜索
  var p=new URLSearchParams(location.search).get('q');
  if(p){input.value=p;run();}
  input.focus();
})();
</script>
</body>
</html>
